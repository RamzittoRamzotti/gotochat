<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gotochat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .auth-card {
      background: #1a1d27;
      border: 1px solid #2d3147;
      border-radius: 12px;
      padding: 36px 40px;
      width: 360px;
    }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: 24px; color: #fff; }
    .auth-card .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      background: #252837; color: #94a3b8; cursor: pointer; font-size: 0.9rem;
    }
    .tab-btn.active { background: #3b5bdb; color: #fff; }
    .auth-card input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      background: #252837; border: 1px solid #3a3f5c; border-radius: 8px;
      color: #e2e8f0; font-size: 0.95rem; outline: none;
    }
    .auth-card input:focus { border-color: #3b5bdb; }
    .auth-card button.submit {
      width: 100%; padding: 11px; background: #3b5bdb; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    .auth-card button.submit:hover { background: #2f4ac7; }
    #auth-error { color: #f87171; font-size: 0.85rem; margin-top: 10px; min-height: 18px; }

    #chat-screen { display: none; flex: 1; overflow: hidden; flex-direction: row; }

    .sidebar {
      width: 220px; background: #13161f; border-right: 1px solid #1e2235;
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 16px; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: #64748b; border-bottom: 1px solid #1e2235;
    }
    .room-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .room-item {
      padding: 9px 16px; cursor: pointer; border-radius: 6px;
      margin: 2px 8px; font-size: 0.9rem; color: #94a3b8;
    }
    .room-item:hover { background: #1e2235; color: #e2e8f0; }
    .room-item.active { background: #1e2a4a; color: #7ba4f7; }
    .room-item::before { content: "# "; opacity: 0.5; }
    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid #1e2235;
      font-size: 0.85rem; color: #64748b;
    }
    .sidebar-footer span { color: #7ba4f7; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header {
      padding: 14px 20px; border-bottom: 1px solid #1e2235;
      display: flex; align-items: center; gap: 8px;
    }
    .chat-header h2 { font-size: 1rem; color: #fff; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    }
    .status-dot.offline { background: #ef4444; }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #2d3147; border-radius: 3px; }

    .msg {
      display: flex; gap: 10px; align-items: flex-start; max-width: 680px;
    }
    .msg.own { flex-direction: row-reverse; align-self: flex-end; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #3b5bdb; display: flex; align-items: center;
      justify-content: center; font-size: 0.8rem; font-weight: 600;
      flex-shrink: 0; color: #fff;
    }
    .msg.own .msg-avatar { background: #0d9488; }
    .msg-body { display: flex; flex-direction: column; gap: 3px; }
    .msg-meta { display: flex; align-items: baseline; gap: 8px; }
    .msg.own .msg-meta { flex-direction: row-reverse; }
    .msg-author { font-size: 0.8rem; font-weight: 600; color: #7ba4f7; }
    .msg.own .msg-author { color: #2dd4bf; }
    .msg-time { font-size: 0.72rem; color: #475569; }
    .msg-text {
      background: #1e2235; padding: 8px 12px; border-radius: 0 10px 10px 10px;
      font-size: 0.92rem; line-height: 1.5; word-break: break-word;
    }
    .msg.own .msg-text {
      background: #1e3a5f; border-radius: 10px 0 10px 10px;
    }

    .system-msg {
      text-align: center; font-size: 0.78rem; color: #475569; padding: 2px 0;
    }

    .chat-input-area {
      padding: 12px 20px; border-top: 1px solid #1e2235;
      display: flex; gap: 10px; align-items: center;
    }
    #msg-input {
      flex: 1; padding: 10px 14px; background: #1e2235;
      border: 1px solid #2d3147; border-radius: 8px;
      color: #e2e8f0; font-size: 0.95rem; outline: none; resize: none;
    }
    #msg-input:focus { border-color: #3b5bdb; }
    #send-btn {
      padding: 10px 18px; background: #3b5bdb; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    }
    #send-btn:hover { background: #2f4ac7; }
    #send-btn:disabled { background: #252837; color: #475569; cursor: default; }
  </style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <h1>Gotochat</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Войти</button>
      <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
    </div>
    <input id="username" type="text" placeholder="Имя пользователя" />
    <input id="password" type="password" placeholder="Пароль" />
    <button class="submit" onclick="submitAuth()">Продолжить</button>
    <div id="auth-error"></div>
  </div>
</div>

<div id="chat-screen">
  <div class="sidebar">
    <div class="sidebar-header">Комнаты</div>
    <div class="room-list" id="room-list"></div>
    <div class="sidebar-footer">Вы: <span id="current-user"></span></div>
  </div>
  <div class="main">
    <div class="chat-header">
      <div class="status-dot offline" id="ws-dot"></div>
      <h2 id="room-title">Выберите комнату</h2>
    </div>
    <div id="messages"></div>
    <div class="chat-input-area">
      <input id="msg-input" type="text" placeholder="Сообщение..." disabled
             onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="send-btn" onclick="sendMessage()" disabled>Отправить</button>
    </div>
  </div>
</div>

<script>
  const ROOMS = ['room0','room1','room2','room3','room4','room5','room6','room7','room8','room9'];

  let currentTab = 'login';
  let currentUser = '';
  let currentRoom = '';
  let ws = null;

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0) === (tab === 'login'));
    });
    document.getElementById('auth-error').textContent = '';
  }

  async function submitAuth() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) {
      setError('Заполните все поля'); return;
    }
    if (currentTab === 'register') {
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) { setError('Ошибка регистрации'); return; }
    }
    const loginRes = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include',
    });
    if (!loginRes.ok) { setError('Неверный логин или пароль'); return; }
    currentUser = username;
    showChat();
  }

  function setError(msg) {
    document.getElementById('auth-error').textContent = msg;
  }

  function showChat() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('current-user').textContent = currentUser;

    const list = document.getElementById('room-list');
    list.innerHTML = '';
    ROOMS.forEach(id => {
      const el = document.createElement('div');
      el.className = 'room-item';
      el.textContent = id;
      el.onclick = () => joinRoom(id);
      list.appendChild(el);
    });
  }

  function joinRoom(roomID) {
    if (ws) ws.close();

    currentRoom = roomID;
    document.getElementById('room-title').textContent = roomID;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled = true;

    document.querySelectorAll('.room-item').forEach(el => {
      el.classList.toggle('active', el.textContent === roomID);
    });

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/chat/${roomID}`);
    ws.binaryType = "blob";

    ws.onopen = () => {
      setDot(true);
      addSystem(`Вы вошли в ${roomID}`);
      document.getElementById('msg-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('msg-input').focus();
    };

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { data = { content: e.data }; }
      const sender = data.sender || data.sender_name || data.client_id || '?';
      addMessage(sender, data.content || data.message || e.data, sender === currentUser);
    };

    ws.onclose = () => {
      setDot(false);
      addSystem('Соединение разорвано');
      document.getElementById('msg-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
    };

    ws.onerror = () => addSystem('Ошибка соединения');
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(text);
    addMessage(currentUser, text, true);
    input.value = '';
  }

  function addMessage(author, text, own) {
    const feed = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg' + (own ? ' own' : '');
    const initials = author.slice(0, 2).toUpperCase();
    const time = new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `
      <div class="msg-avatar">${initials}</div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-author">${escHtml(author)}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="msg-text">${escHtml(text)}</div>
      </div>`;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
  }

  function addSystem(text) {
    const feed = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = text;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
  }

  function setDot(online) {
    const dot = document.getElementById('ws-dot');
    dot.classList.toggle('offline', !online);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
